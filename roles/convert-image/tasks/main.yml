---
- name: generate convert script
  template:
    src: "{{ convert_image_template }}"
    dest: "{{ convert_image_working_dir }}/convert_image.sh"

- name: "check if we have an {{ convert_image_base }}.qcow2 to start from"
  stat:
    path: "{{ convert_image_working_dir }}/{{ convert_image_base }}.qcow2"
  register: overcloud_full_qcow2

# This tasks is not be used in CI or on any public systems
# Only use this option when debugging locally on a secure system
- name: set root password for image
  command: >
    virt-customize --smp 2 -m {{ convert_image_host_memory }}
    -a {{ convert_image_working_dir }}/{{ convert_image_base }}.qcow2
    --root-password password:{{ overcloud_full_root_pwd }}
  when:
    - overcloud_full_root_pwd is defined
    - overcloud_full_qcow2.stat.exists

- name: render the UEFI local boot fix script
  template:
    src: uefi_boot_fix.sh.j2
    dest: "{{ convert_image_working_dir }}/uefi_boot_fix.sh"
    mode: 0755
  when: convert_image_fix_uefi_boot|default(true)|bool

# The base image is the one uploaded to glance and deployed to the
# overcloud nodes, which boot locally through the ESP template this
# fixes (the undercloud image is direct-kernel-booted and never runs
# grub). Apply the fix to the base BEFORE the copy to undercloud.qcow2
# so both images carry it.
- name: apply the UEFI local boot fix to the base image
  command: >
    virt-customize --smp 2 -m {{ convert_image_host_memory }}
    -a {{ convert_image_working_dir }}/{{ convert_image_base }}.qcow2
    --run uefi_boot_fix.sh
  changed_when: true
  args:
    chdir: "{{ convert_image_working_dir }}"
  environment:
    LIBGUESTFS_BACKEND: direct
    LIBVIRT_DEFAULT_URI: "{{ libvirt_uri }}"
  when:
    - convert_image_fix_uefi_boot|default(true)|bool
    - overcloud_full_qcow2.stat.exists

# The deploy agent (IPA ramdisk) can read an empty ESP uuid from the
# udev database right after formatting the partition, which makes ironic
# skip the UEFI boot setup (see ipa_ramdisk_fix.sh.j2). Patch the
# initramfs extracted by fetch-images into the working dir: it is the
# file later uploaded into the undercloud and served to the nodes, and
# it is re-extracted fresh from the tarball on every run, so the patch
# must run every time (the script itself is idempotent).
- name: render the IPA ramdisk ESP uuid fix script
  template:
    src: ipa_ramdisk_fix.sh.j2
    dest: "{{ convert_image_working_dir }}/ipa_ramdisk_fix.sh"
    mode: 0755
  when: convert_image_fix_ipa_esp_uuid|default(true)|bool

- name: patch the IPA ramdisk block_uuid to retry on empty probes
  become: true
  command: "{{ convert_image_working_dir }}/ipa_ramdisk_fix.sh {{ convert_image_working_dir }}/ironic-python-agent.initramfs"
  changed_when: true
  when: convert_image_fix_ipa_esp_uuid|default(true)|bool

- name: "copy {{ convert_image_base }}.qcow2 to undercloud.qcow2"
  command: >
    cp {{ convert_image_working_dir }}/{{ convert_image_base }}.qcow2
       {{ convert_image_working_dir }}/undercloud.qcow2
  changed_when: true
  when: overcloud_full_qcow2.stat.exists and overcloud_as_undercloud|bool

# Resize the undercloud image using qemu-img resize
- name: Resize the undercloud image using qemu-image resize
  command: >
    qemu-img resize {{ convert_image_working_dir }}/undercloud.qcow2
                    {{ flavors[undercloud_node.name].disk }}G
  changed_when: true

- name: convert image
  command: >
    virt-customize -v --smp 2 -m {{ convert_image_host_memory }}
    -a {{ convert_image_working_dir }}/undercloud.qcow2
    --run convert_image.sh
  changed_when: true
  args:
    chdir: "{{ convert_image_working_dir }}"
  environment:
    LIBGUESTFS_BACKEND: direct
    LIBVIRT_DEFAULT_URI: "{{ libvirt_uri }}"

- name: collect diagnostic log from undercloud image
  shell: >
    virt-cat -a undercloud.qcow2 /tmp/builder.log > builder-undercloud.log 2>&1;
  changed_when: true
  args:
    chdir: "{{ convert_image_working_dir }}"
  environment:
    LIBGUESTFS_BACKEND: direct
    LIBVIRT_DEFAULT_URI: "{{ libvirt_uri }}"
