---
- name: Add virthost to inventory
  hosts: localhost
  roles:
    - provision/local

- name: Add the virthost node to the generated inventory
  hosts: localhost
  gather_facts: true
  roles:
    - tripleo-inventory

- name: Setup the virthost to build images then build them
  hosts: virthost
  gather_facts: true
  roles:
    - parts/kvm
    - parts/libvirt
    # NOTE: The role used to be named "image-build", it was renamed to
    # "build-images" in tripleo-quickstart-extras and now delegates the actual
    # build to the oooci-build-images role from the tripleo-ci repo.
    # In direct mode (build_image_isolated: false) it runs
    # `openstack overcloud image build` on the virthost and packages
    # overcloud-full.tar and ironic-python-agent.tar (with md5sums) into
    # oooci_image_build_archive_dest.
    # The role places images/logs in images_working_dir, not working_dir.
    - {role: "build-images",
       working_dir: "/var/lib/oooq-images",
       images_working_dir: "/var/lib/oooq-images"}
